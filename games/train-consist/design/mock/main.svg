<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27304f"/>
      <stop offset="1" stop-color="#e58a5a"/>
    </linearGradient>
    <pattern id="crates" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c98a45"/>
      <rect x="1" y="1" width="12" height="12" fill="none" stroke="#7a4a1c" stroke-width="1.5"/>
      <path d="M1 1 L13 13" stroke="#7a4a1c" stroke-width="1"/>
    </pattern>
    <pattern id="gold" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#ffd24d"/>
      <rect x="1" y="1" width="12" height="12" fill="none" stroke="#a36a00" stroke-width="1.5"/>
      <path d="M1 1 L13 13" stroke="#a36a00" stroke-width="1"/>
    </pattern>
    <g id="wheels">
      <circle cx="24" cy="71" r="9" fill="#1c1c22" stroke="#8a8f99" stroke-width="2.5"/>
      <circle cx="76" cy="71" r="9" fill="#1c1c22" stroke="#8a8f99" stroke-width="2.5"/>
      <rect x="-5" y="56" width="10" height="5" fill="#3a3d45"/>
    </g>
    <!-- 칸: 원점은 칸 왼쪽 위(지붕), 몸통 100×62, 바퀴까지 80 -->
    <g id="coal">
      <polygon points="2,6 98,6 86,62 14,62" fill="#4a5563" stroke="#1c1c22" stroke-width="2.5"/>
      <path d="M8 8 Q28 -12 48 4 Q68 -14 92 8 Z" fill="#15151a"/>
      <use href="#wheels"/>
    </g>
    <g id="boiler">
      <rect x="4" y="16" width="92" height="44" rx="22" fill="#b5462f" stroke="#1c1c22" stroke-width="2.5"/>
      <rect x="62" y="-10" width="16" height="28" fill="#5a2318" stroke="#1c1c22" stroke-width="2.5"/>
      <circle cx="30" cy="38" r="13" fill="#ffb02e" stroke="#1c1c22" stroke-width="2.5"/>
      <path d="M24 44 q6 -16 6 -4 q6 -10 6 4 z" fill="#fff1a8"/>
      <rect x="2" y="58" width="96" height="5" fill="#3a3d45"/>
      <use href="#wheels"/>
    </g>
    <g id="box">
      <rect x="2" y="4" width="96" height="58" fill="#3f7d6e" stroke="#1c1c22" stroke-width="2.5"/>
      <rect x="34" y="12" width="32" height="50" fill="#2f6054" stroke="#1c1c22" stroke-width="2"/>
      <rect x="42" y="22" width="16" height="16" fill="url(#crates)"/>
      <path d="M0 4 H100" stroke="#1c1c22" stroke-width="5"/>
      <use href="#wheels"/>
    </g>
    <g id="tank">
      <rect x="3" y="14" width="94" height="46" rx="23" fill="#c9ced6" stroke="#1c1c22" stroke-width="2.5"/>
      <rect x="40" y="0" width="20" height="16" rx="4" fill="#8a8f99" stroke="#1c1c22" stroke-width="2.5"/>
      <path d="M20 14 V60 M80 14 V60" stroke="#8a8f99" stroke-width="3"/>
      <circle cx="50" cy="38" r="10" fill="none" stroke="#b5462f" stroke-width="4"/>
      <rect x="2" y="58" width="96" height="5" fill="#3a3d45"/>
      <use href="#wheels"/>
    </g>
    <g id="crane">
      <rect x="2" y="48" width="96" height="14" fill="#6b5a3a" stroke="#1c1c22" stroke-width="2.5"/>
      <rect x="54" y="18" width="34" height="30" fill="#e0a526" stroke="#1c1c22" stroke-width="2.5"/>
      <rect x="62" y="24" width="14" height="12" fill="#bfe9ff"/>
      <!-- 팔이 앞 칸 위로 뻗는다 -->
      <path d="M64 20 L-34 -22" stroke="#e0a526" stroke-width="8" stroke-linecap="round"/>
      <path d="M64 20 L-34 -22" stroke="#1c1c22" stroke-width="2" stroke-dasharray="6 8"/>
      <path d="M-34 -22 V-2 q0 9 -9 9" fill="none" stroke="#1c1c22" stroke-width="3"/>
      <use href="#wheels"/>
    </g>
    <g id="mail">
      <rect x="2" y="4" width="96" height="58" fill="#3b5ea8" stroke="#1c1c22" stroke-width="2.5"/>
      <rect x="30" y="20" width="40" height="26" fill="#fff" stroke="#1c1c22" stroke-width="2"/>
      <path d="M30 20 L50 36 L70 20" fill="none" stroke="#1c1c22" stroke-width="2"/>
      <use href="#wheels"/>
    </g>
    <g id="diner">
      <rect x="2" y="4" width="96" height="58" rx="6" fill="#8e4a7c" stroke="#1c1c22" stroke-width="2.5"/>
      <g fill="#ffe7a8" stroke="#1c1c22" stroke-width="2"><rect x="12" y="16" width="20" height="20"/><rect x="40" y="16" width="20" height="20"/><rect x="68" y="16" width="20" height="20"/></g>
      <use href="#wheels"/>
    </g>
  </defs>

  <!-- 하늘과 역 -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <polygon points="0,236 150,180 300,222 470,170 640,216 800,176 960,226 960,336 0,336" fill="#3a3558" opacity="0.7"/>
  <!-- 역사: 간판에 이번 역의 목표 -->
  <g>
    <rect x="330" y="96" width="330" height="140" fill="#6b4a3a" stroke="#1c1c22" stroke-width="3"/>
    <polygon points="310,100 495,40 680,100" fill="#8a3a2c" stroke="#1c1c22" stroke-width="3"/>
    <circle cx="495" cy="78" r="13" fill="#fff6dd" stroke="#1c1c22" stroke-width="2.5"/>
    <path d="M495 78 V69 M495 78 H502" stroke="#1c1c22" stroke-width="2"/>
    <g fill="#ffd98a" stroke="#1c1c22" stroke-width="2"><rect x="350" y="170" width="36" height="50"/><rect x="604" y="170" width="36" height="50"/></g>
    <rect x="410" y="116" width="170" height="64" rx="6" fill="#fff6dd" stroke="#1c1c22" stroke-width="3"/>
    <rect x="424" y="131" width="34" height="34" fill="url(#crates)" stroke="#7a4a1c" stroke-width="2"/>
    <text x="518" y="163" font-size="44" font-weight="800" text-anchor="middle" fill="#1c1c22">150</text>
  </g>

  <!-- 노선(전체 상황): 여덟 역 중 여섯째, 앞으로 올 승강장 길이 -->
  <g transform="translate(24,22)">
    <path d="M0 0 H330" stroke="#fff6dd" stroke-width="3" opacity="0.6"/>
    <g fill="#fff6dd"><circle cx="0" r="5"/><circle cx="47" r="5"/><circle cx="94" r="5"/><circle cx="141" r="5"/><circle cx="188" r="5"/></g>
    <circle cx="235" r="10" fill="#ffd24d" stroke="#1c1c22" stroke-width="2.5"/>
    <g fill="none" stroke="#fff6dd" stroke-width="2.5"><circle cx="282" r="6"/><circle cx="329" r="6"/></g>
    <!-- 다음 역들의 승강장 길이(칸 수만큼의 눈금) -->
    <g fill="#fff6dd" opacity="0.85">
      <rect x="268" y="12" width="5" height="8"/><rect x="275" y="12" width="5" height="8"/><rect x="282" y="12" width="5" height="8"/><rect x="289" y="12" width="5" height="8"/>
      <rect x="308" y="12" width="5" height="8"/><rect x="315" y="12" width="5" height="8"/><rect x="322" y="12" width="5" height="8"/><rect x="329" y="12" width="5" height="8"/><rect x="336" y="12" width="5" height="8"/><rect x="343" y="12" width="5" height="8"/><rect x="350" y="12" width="5" height="8"/>
    </g>
  </g>

  <!-- 땅과 승강장: 승강장은 6칸 길이, 그 뒤는 자갈 -->
  <rect x="0" y="330" width="960" height="110" fill="#4a4338"/>
  <rect x="0" y="338" width="820" height="92" fill="#d9cfb8"/>
  <rect x="0" y="338" width="820" height="8" fill="#f4d23c"/>
  <polygon points="820,338 846,430 820,430" fill="#b3a98f"/>
  <rect x="816" y="296" width="8" height="46" fill="#1c1c22"/>
  <rect x="806" y="286" width="28" height="16" fill="#e0442f" stroke="#1c1c22" stroke-width="2"/>
  <!-- 선로 -->
  <rect x="0" y="329" width="960" height="5" fill="#8a8f99"/>

  <!-- 증기관: 굵기와 색이 곧 압력(배율) -->
  <g fill="none" stroke-linecap="round">
    <path d="M120 232 H268" stroke="#d8dde6" stroke-width="4"/>
    <path d="M268 232 H380" stroke="#ff9a3c" stroke-width="10"/>
    <path d="M380 232 H710" stroke="#ff5a2a" stroke-width="12"/>
    <path d="M710 232 H930" stroke="#d8dde6" stroke-width="4"/>
  </g>
  <!-- 압력계 -->
  <g font-size="15" font-weight="800" text-anchor="middle">
    <g transform="translate(325,232)"><circle r="15" fill="#fff6dd" stroke="#1c1c22" stroke-width="2.5"/><text y="5" fill="#b5462f">×4</text></g>
    <g transform="translate(435,232)"><circle r="15" fill="#fff6dd" stroke="#1c1c22" stroke-width="2.5"/><text y="5" fill="#b5462f">×5</text></g>
    <g transform="translate(765,232)"><circle r="13" fill="#fff6dd" stroke="#1c1c22" stroke-width="2.5" opacity="0.8"/><text y="5" fill="#5d6470">×1</text></g>
  </g>

  <!-- 기관차(왼쪽으로 달린다) -->
  <g transform="translate(15,250)">
    <rect x="10" y="20" width="90" height="42" rx="18" fill="#22262e" stroke="#0e0f13" stroke-width="2.5"/>
    <rect x="86" y="-6" width="48" height="68" fill="#b5462f" stroke="#0e0f13" stroke-width="2.5"/>
    <rect x="96" y="6" width="26" height="22" fill="#ffe7a8" stroke="#0e0f13" stroke-width="2"/>
    <rect x="26" y="-10" width="16" height="32" fill="#22262e" stroke="#0e0f13" stroke-width="2.5"/>
    <polygon points="0,62 14,40 14,62" fill="#8a8f99"/>
    <circle cx="32" cy="68" r="12" fill="#1c1c22" stroke="#8a8f99" stroke-width="2.5"/>
    <circle cx="64" cy="68" r="12" fill="#1c1c22" stroke="#8a8f99" stroke-width="2.5"/>
    <circle cx="112" cy="68" r="12" fill="#1c1c22" stroke="#8a8f99" stroke-width="2.5"/>
    <g fill="#fff" opacity="0.6"><circle cx="34" cy="-26" r="12"/><circle cx="50" cy="-48" r="16"/><circle cx="76" cy="-70" r="20"/></g>
  </g>

  <!-- 편성: 칸 간격 110 -->
  <use href="#boiler" x="275" y="250"/>
  <use href="#boiler" x="385" y="250"/>
  <use href="#box" x="495" y="250"/>
  <use href="#tank" x="605" y="250"/>
  <use href="#crane" x="715" y="250"/>
  <use href="#box" x="825" y="250" opacity="0.45"/>

  <!-- 끌어 넣는 중인 석탄칸: 보일러 바로 앞 자리 -->
  <rect x="163" y="248" width="104" height="84" rx="6" fill="#ffd24d" opacity="0.22"/>
  <rect x="163" y="248" width="104" height="84" rx="6" fill="none" stroke="#ffd24d" stroke-width="3" stroke-dasharray="8 6"/>
  <ellipse cx="215" cy="330" rx="46" ry="6" fill="#000" opacity="0.35"/>
  <g transform="translate(160,222) rotate(-3 50 40)">
    <use href="#coal"/>
  </g>
  <!-- 석탄이 보일러로 들어가는 홈통(붙으면 이어진다) -->
  <path d="M252 246 Q272 236 292 262" fill="none" stroke="#ffd24d" stroke-width="7" stroke-linecap="round"/>
  <path d="M252 246 Q272 236 292 262" fill="none" stroke="#15151a" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>
  <!-- 손가락 -->
  <circle cx="212" cy="262" r="30" fill="#fff" opacity="0.28"/>
  <circle cx="212" cy="262" r="30" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.8"/>

  <!-- 승강장에 내려질 짐(미리 보기): 더미의 크기가 곧 수입 -->
  <g>
    <rect x="510" y="368" width="70" height="56" fill="url(#crates)" stroke="#7a4a1c" stroke-width="2"/>
    <rect x="606" y="354" width="98" height="70" fill="url(#gold)" stroke="#a36a00" stroke-width="2"/>
    <rect x="716" y="354" width="98" height="70" fill="url(#gold)" stroke="#a36a00" stroke-width="2" opacity="0.75"/>
    <!-- 방금 커진 만큼 반짝 -->
    <rect x="606" y="354" width="98" height="70" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 5"/>
    <rect x="716" y="354" width="98" height="70" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 5"/>
    <g font-size="20" font-weight="800" text-anchor="middle">
      <g transform="translate(545,362)"><rect x="-22" y="-20" width="44" height="26" rx="6" fill="#1c1c22"/><text y="0" fill="#fff">20</text></g>
      <g transform="translate(655,348)"><rect x="-22" y="-20" width="44" height="26" rx="6" fill="#1c1c22"/><text y="0" fill="#ffd24d">75</text></g>
      <g transform="translate(765,348)"><rect x="-22" y="-20" width="44" height="26" rx="6" fill="#1c1c22"/><text y="0" fill="#ffd24d">75</text></g>
    </g>
  </g>

  <!-- 아래 띠: 측선 / 화물 저울 / 입환 등과 기적 -->
  <rect x="0" y="440" width="960" height="100" fill="#1c1c26"/>
  <!-- 측선: 이번 역에서 고르지 않은 칸 -->
  <g>
    <rect x="16" y="520" width="290" height="4" fill="#8a8f99"/>
    <g transform="translate(30,466) scale(0.62)" opacity="0.5"><use href="#mail"/></g>
    <g transform="translate(120,466) scale(0.62)" opacity="0.5"><use href="#diner"/></g>
    <!-- 고철 자리: 여기로 끌면 칸을 버린다 -->
    <rect x="222" y="462" width="76" height="52" rx="8" fill="none" stroke="#8a8f99" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M246 476 L274 500 M274 476 L246 500" stroke="#8a8f99" stroke-width="3"/>
  </g>
  <!-- 화물 저울: 이 편성으로 내려질 짐의 합과 목표 깃발 -->
  <g transform="translate(336,470)">
    <rect x="0" y="0" width="400" height="40" rx="8" fill="#0e0f13" stroke="#8a8f99" stroke-width="2.5"/>
    <rect x="4" y="4" width="140" height="32" rx="5" fill="#c98a45" opacity="0.55"/>
    <rect x="144" y="4" width="196" height="32" rx="5" fill="#ffd24d"/>
    <path d="M144 2 V38" stroke="#fff6dd" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M300 -16 V44" stroke="#e0442f" stroke-width="4"/>
    <polygon points="300,-16 330,-8 300,0" fill="#e0442f"/>
    <text x="340" y="62" font-size="24" font-weight="800" text-anchor="end" fill="#ffd24d">170</text>
    <text x="348" y="62" font-size="18" font-weight="700" fill="#8a8f99">/ 150</text>
  </g>
  <!-- 입환 등: 세 번 중 마지막 한 번 -->
  <g transform="translate(772,470)">
    <circle cx="0" cy="0" r="10" fill="#33363f" stroke="#8a8f99" stroke-width="2"/>
    <circle cx="0" cy="26" r="10" fill="#33363f" stroke="#8a8f99" stroke-width="2"/>
    <circle cx="0" cy="52" r="11" fill="#7dff8a" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="52" r="18" fill="#7dff8a" opacity="0.25"/>
  </g>
  <!-- 기적 줄(유일한 버튼): 당기면 정산 -->
  <g transform="translate(868,490)">
    <path d="M0 -50 V-28" stroke="#fff6dd" stroke-width="4"/>
    <circle r="40" fill="#b5462f" stroke="#fff6dd" stroke-width="4"/>
    <path d="M-16 -8 h20 q14 0 14 12 v6 h-10 v-6 q0 -3 -4 -3 h-20 z" fill="#fff6dd"/>
    <g stroke="#fff6dd" stroke-width="3" stroke-linecap="round"><path d="M24 -20 l8 -8"/><path d="M28 -6 l11 -3"/></g>
  </g>
</svg>
