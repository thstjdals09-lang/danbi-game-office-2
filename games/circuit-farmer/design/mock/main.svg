<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <!-- 작물 그림 (0,0 중심, 반지름 약 20) -->
    <g id="turnip">
      <path d="M-4 -14 Q-12 -26 -2 -22 M0 -14 Q0 -30 4 -22 M4 -14 Q14 -24 6 -18" fill="none" stroke="#3f8f3a" stroke-width="5" stroke-linecap="round"/>
      <path d="M-15 -4 Q-15 -16 0 -16 Q15 -16 15 -4 Q14 12 0 20 Q-14 12 -15 -4 Z" fill="#f4eef2" stroke="#7a4a78" stroke-width="2.5"/>
      <path d="M-15 -4 Q-15 -16 0 -16 Q15 -16 15 -4 Q0 -9 -15 -4 Z" fill="#b565b0"/>
    </g>
    <g id="wheat">
      <path d="M0 20 L0 -6 M-9 20 L-11 -2 M9 20 L11 -2" stroke="#b98a1e" stroke-width="3" fill="none"/>
      <ellipse cx="0" cy="-12" rx="5.5" ry="11" fill="#f2c230" stroke="#b98a1e" stroke-width="2"/>
      <ellipse cx="-12" cy="-8" rx="5" ry="10" fill="#f2c230" stroke="#b98a1e" stroke-width="2" transform="rotate(-12 -12 -8)"/>
      <ellipse cx="12" cy="-8" rx="5" ry="10" fill="#f2c230" stroke="#b98a1e" stroke-width="2" transform="rotate(12 12 -8)"/>
    </g>
    <g id="pumpkin">
      <rect x="-3" y="-20" width="6" height="9" rx="2" fill="#4d7a2a"/>
      <ellipse cx="0" cy="2" rx="20" ry="16" fill="#f08a24" stroke="#a8520c" stroke-width="2.5"/>
      <path d="M-8 -13 Q-14 2 -8 17 M8 -13 Q14 2 8 17 M0 -14 L0 18" fill="none" stroke="#a8520c" stroke-width="2"/>
    </g>
    <!-- 날 구슬: 잎(자라는 날) / 해(익은 채 버티는 날) / 눈(눈에 덮이는 날) -->
    <g id="p-grow"><path d="M0 -9 Q9 -2 0 9 Q-9 -2 0 -9 Z" fill="#3f8f3a" stroke="#235a22" stroke-width="1.5"/></g>
    <g id="p-ripe"><circle r="8.5" fill="#f2c230" stroke="#a87410" stroke-width="2"/></g>
    <g id="p-snow"><rect x="-6.5" y="-6.5" width="13" height="13" fill="#fff" stroke="#7fa6c9" stroke-width="2" transform="rotate(45)"/></g>
    <!-- 도착 표시: 곧장 가면 닿는 날의 구슬에 걸리는 테 -->
    <g id="arrive"><circle r="14" fill="none" stroke="#3a2a1a" stroke-width="3.5"/><path d="M-6 21 L0 14 L6 21 Z" fill="#3a2a1a"/></g>
    <g id="house">
      <rect x="-20" y="-6" width="40" height="28" fill="#f1e2c4" stroke="#6b4a2c" stroke-width="2"/>
      <polygon points="-26,-6 0,-28 26,-6" fill="#b5533c" stroke="#6b4a2c" stroke-width="2"/>
      <rect x="-5" y="6" width="10" height="16" fill="#6b4a2c"/>
    </g>
  </defs>

  <!-- ── 길을 편 띠들: 위 = 앞쪽 길, 아래 = 뒤쪽 길. 한 띠 = 하루 거리 ── -->
  <rect x="0" y="0" width="540" height="80" fill="#e9f1fa"/>      <!-- 나흘 앞(맞은편 밭) · 눈 -->
  <rect x="0" y="80" width="540" height="70" fill="#f3f8fd"/>     <!-- 사흘 앞 · 눈 -->
  <rect x="0" y="150" width="540" height="92" fill="#9ccb68"/>    <!-- 이틀 앞 · 먼 마을 -->
  <rect x="0" y="242" width="540" height="118" fill="#a6d470"/>   <!-- 하루 앞 · 호박밭 -->
  <rect x="0" y="360" width="540" height="240" fill="#bfe486"/>   <!-- 지금 선 밭 -->
  <rect x="0" y="600" width="540" height="118" fill="#a6d470"/>   <!-- 하루 뒤 · 순무밭 -->
  <rect x="0" y="718" width="540" height="92" fill="#9ccb68"/>    <!-- 이틀 뒤 · 고향 마을 -->
  <rect x="0" y="810" width="540" height="70" fill="#93c260"/>    <!-- 사흘 뒤 · 막 녹은 밭 -->
  <g stroke="#5f8f3c" stroke-width="3" opacity="0.6">
    <line x1="140" y1="242" x2="540" y2="242"/><line x1="170" y1="360" x2="540" y2="360"/>
    <line x1="170" y1="600" x2="540" y2="600"/><line x1="140" y1="718" x2="540" y2="718"/><line x1="130" y1="810" x2="540" y2="810"/>
  </g>

  <!-- 길 (가까울수록 넓다) -->
  <polygon points="76,0 114,0 114,80 118,150 125,242 135,360 160,384 160,576 135,600 125,718 118,810 114,880 76,880 72,810 65,718 55,600 30,576 30,384 55,360 65,242 72,150 76,80" fill="#d9bd8a"/>
  <polygon points="76,0 114,0 114,80 118,150 72,150 76,80" fill="#ffffff"/>

  <!-- 눈 덮인 두 밭 -->
  <g fill="#ffffff" stroke="#c4d6ea" stroke-width="2">
    <ellipse cx="230" cy="48" rx="62" ry="16"/><ellipse cx="236" cy="118" rx="72" ry="20"/>
  </g>
  <g fill="#b9cfe6"><circle cx="150" cy="30" r="3"/><circle cx="320" cy="60" r="3"/><circle cx="160" cy="110" r="3.5"/><circle cx="330" cy="96" r="3.5"/><circle cx="500" cy="24" r="3"/></g>
  <!-- 눈이 걷히기까지 남은 날 -->
  <g transform="translate(356 48) scale(0.7)"><use xlink:href="#p-snow"/><use xlink:href="#p-snow" x="24"/></g>
  <g transform="translate(350 118) scale(0.8)">
    <use xlink:href="#p-snow"/><use xlink:href="#p-snow" x="23"/><use xlink:href="#p-snow" x="46"/><use xlink:href="#p-snow" x="69"/><use xlink:href="#p-snow" x="92"/><use xlink:href="#p-snow" x="115"/><use xlink:href="#p-snow" x="138"/>
  </g>

  <!-- 먼 마을 (이틀 앞): 호박을 비싸게 산다. 서리가 위에서 기어 내려온다 -->
  <use xlink:href="#house" x="190" y="208"/><use xlink:href="#house" x="246" y="214"/>
  <rect x="290" y="184" width="50" height="46" rx="10" fill="#fff8e6" stroke="#6b4a2c" stroke-width="3"/>
  <g transform="translate(315 208) scale(0.8)"><use xlink:href="#pumpkin"/></g>
  <rect x="312" y="230" width="6" height="10" fill="#6b4a2c"/>
  <use xlink:href="#p-ripe" x="378" y="212"/><use xlink:href="#p-ripe" x="402" y="212"/>
  <use xlink:href="#p-snow" x="426" y="212"/><use xlink:href="#p-snow" x="450" y="212"/><use xlink:href="#p-snow" x="474" y="212"/><use xlink:href="#p-snow" x="498" y="212"/>
  <use xlink:href="#arrive" x="402" y="212"/>
  <!-- 서리 앞 끝 (닷새 중 사흘째) -->
  <polygon points="0,150 540,150 540,166 510,180 478,164 446,182 412,166 380,180 346,164 312,178 280,164 246,180 212,166 178,182 146,166 112,180 80,164 46,180 0,166" fill="#ffffff" opacity="0.94"/>

  <!-- 호박밭 (하루 앞): 이틀 뒤 익는다 -->
  <rect x="164" y="258" width="160" height="88" rx="12" fill="#7a5632"/>
  <g fill="#3f8f3a"><ellipse cx="196" cy="290" rx="16" ry="10"/><ellipse cx="236" cy="312" rx="18" ry="11"/><ellipse cx="282" cy="288" rx="16" ry="10"/><ellipse cx="290" cy="324" rx="14" ry="9"/></g>
  <g fill="#9fbf3a" stroke="#4d7a2a" stroke-width="2"><ellipse cx="214" cy="316" rx="10" ry="8"/><ellipse cx="262" cy="296" rx="11" ry="9"/></g>
  <use xlink:href="#p-grow" x="350" y="301"/><use xlink:href="#p-grow" x="376" y="301"/>
  <use xlink:href="#p-ripe" x="402" y="301"/><use xlink:href="#p-ripe" x="428" y="301"/><use xlink:href="#p-ripe" x="454" y="301"/><use xlink:href="#p-ripe" x="480" y="301"/>
  <use xlink:href="#arrive" x="350" y="301"/>
  <path d="M83 318 L95 300 L107 318" fill="none" stroke="#8a6a3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── 지금 선 밭: 밀이 익었다 (버티는 날 이틀) ── -->
  <rect x="282" y="382" width="242" height="170" rx="16" fill="#7a5632"/>
  <g transform="translate(326 440) scale(1.9)"><use xlink:href="#wheat"/></g>
  <g transform="translate(402 432) scale(1.9)"><use xlink:href="#wheat"/></g>
  <g transform="translate(478 440) scale(1.9)"><use xlink:href="#wheat"/></g>
  <g transform="translate(364 502) scale(1.9)"><use xlink:href="#wheat"/></g>
  <g transform="translate(440 502) scale(1.9)"><use xlink:href="#wheat"/></g>
  <g fill="#fff8c8"><path d="M300 396 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/><path d="M506 516 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/></g>
  <g transform="translate(388 577) scale(1.25)"><use xlink:href="#p-ripe"/></g>
  <g transform="translate(418 577) scale(1.25)"><use xlink:href="#p-ripe"/></g>

  <!-- 나귀와 수레: 짐 네 칸(호박, 순무, 빈 칸 둘) -->
  <ellipse cx="95" cy="398" rx="20" ry="26" fill="#8d8176" stroke="#4f463e" stroke-width="2.5"/>
  <ellipse cx="95" cy="374" rx="11" ry="13" fill="#8d8176" stroke="#4f463e" stroke-width="2.5"/>
  <path d="M86 364 l-5 -12 M104 364 l5 -12" stroke="#4f463e" stroke-width="5" stroke-linecap="round"/>
  <line x1="68" y1="408" x2="50" y2="430" stroke="#6b4a2c" stroke-width="5"/><line x1="122" y1="408" x2="140" y2="430" stroke="#6b4a2c" stroke-width="5"/>
  <rect x="8" y="450" width="18" height="48" rx="6" fill="#4f3a26"/><rect x="186" y="450" width="18" height="48" rx="6" fill="#4f3a26"/>
  <rect x="8" y="522" width="18" height="48" rx="6" fill="#4f3a26"/><rect x="186" y="522" width="18" height="48" rx="6" fill="#4f3a26"/>
  <rect x="22" y="428" width="168" height="164" rx="10" fill="#a8743c" stroke="#5e3d1c" stroke-width="4"/>
  <rect x="30" y="436" width="76" height="76" rx="6" fill="#c99a5e"/><rect x="106" y="436" width="76" height="76" rx="6" fill="#c08f52"/>
  <rect x="32" y="514" width="72" height="70" rx="6" fill="none" stroke="#5e3d1c" stroke-width="2.5" stroke-dasharray="7 6"/>
  <rect x="108" y="514" width="72" height="70" rx="6" fill="none" stroke="#5e3d1c" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g transform="translate(68 476) scale(1.5)"><use xlink:href="#pumpkin"/></g>
  <g transform="translate(144 478) scale(1.5)"><use xlink:href="#turnip"/></g>

  <!-- 수레 옆에 걸린 씨앗 자루 셋 (끌어다 밭에 놓는다) -->
  <g stroke="#6b4a2c" stroke-width="3" fill="#e8d5a8">
    <rect x="208" y="398" width="66" height="58" rx="12"/><rect x="208" y="462" width="66" height="58" rx="12"/><rect x="208" y="526" width="66" height="58" rx="12"/>
  </g>
  <g transform="translate(241 430) scale(0.85)"><use xlink:href="#turnip"/></g>
  <g transform="translate(241 492) scale(0.85)"><use xlink:href="#wheat"/></g>
  <g transform="translate(241 555) scale(0.85)"><use xlink:href="#pumpkin"/></g>

  <!-- 순무밭 (하루 뒤): 익었고 오늘이 마지막 날 -->
  <path d="M83 642 L95 660 L107 642" fill="none" stroke="#8a6a3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="164" y="616" width="160" height="88" rx="12" fill="#7a5632"/>
  <g transform="translate(200 662) scale(1.15)"><use xlink:href="#turnip"/></g>
  <g transform="translate(246 660) scale(1.15)"><use xlink:href="#turnip"/></g>
  <g transform="translate(290 664) scale(1.15)"><use xlink:href="#turnip"/></g>
  <use xlink:href="#p-ripe" x="350" y="655"/>
  <circle cx="350" cy="655" r="8.5" fill="none" stroke="#d6331f" stroke-width="3.5"/>
  <use xlink:href="#arrive" x="350" y="655"/>

  <!-- 고향 마을 (이틀 뒤): 밀을 비싸게 산다 -->
  <use xlink:href="#house" x="200" y="776"/><use xlink:href="#house" x="254" y="782"/>
  <rect x="156" y="730" width="4" height="70" fill="#6b4a2c"/><polygon points="160,730 186,738 160,746" fill="#e0452f"/>
  <path d="M266 748 q6 -8 0 -14 q-6 -6 2 -12" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <rect x="300" y="738" width="50" height="46" rx="10" fill="#fff8e6" stroke="#6b4a2c" stroke-width="3"/>
  <g transform="translate(325 764) scale(0.8)"><use xlink:href="#wheat"/></g>
  <rect x="322" y="784" width="6" height="14" fill="#6b4a2c"/>

  <!-- 막 녹은 밭 (사흘 뒤): 맨땅 -->
  <rect x="170" y="822" width="140" height="46" rx="10" fill="#5e4226"/>
  <g fill="#fff8c8"><path d="M200 836 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/><path d="M270 836 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z"/></g>

  <!-- 아래 띠: 돈주머니와 올해 목표 -->
  <rect x="0" y="880" width="540" height="80" fill="#3a2a1a"/>
  <path d="M34 904 q18 -12 36 0 q14 22 0 40 q-18 8 -36 0 q-14 -18 0 -40 Z" fill="#e8c46a" stroke="#8a6410" stroke-width="3"/>
  <rect x="42" y="896" width="20" height="8" rx="3" fill="#8a6410"/>
  <rect x="96" y="914" width="340" height="18" rx="9" fill="#5a4630"/>
  <rect x="96" y="914" width="132" height="18" rx="9" fill="#f2c230"/>
  <g fill="#fff8c8" stroke="#8a6410" stroke-width="2">
    <path d="M300 904 l5 12 l13 1 l-10 9 l3 13 l-11 -7 l-11 7 l3 -13 l-10 -9 l13 -1 Z"/>
    <path d="M368 908 l4 9 l10 1 l-8 7 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -7 l10 -1 Z" opacity="0.6"/>
    <path d="M436 908 l4 9 l10 1 l-8 7 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -7 l10 -1 Z" opacity="0.6"/>
  </g>
  <g opacity="0.8"><circle cx="500" cy="922" r="20" fill="#5a4630"/><rect x="493" y="913" width="5" height="18" fill="#e8d5a8"/><rect x="502" y="913" width="5" height="18" fill="#e8d5a8"/></g>
</svg>
