<svg viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
<defs>
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a3d"/><stop offset="1" stop-color="#4a2f52"/></linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2c50"/><stop offset="1" stop-color="#5b4468"/></linearGradient>
  <radialGradient id="fireglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb347" stop-opacity="0.8"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e4c6"/><stop offset="1" stop-color="#e2d0a6"/></linearGradient>
  <!-- 낱말 타일 세 가지 모양: 꾸미는 말(오른쪽이 뾰족 — 뒤 낱말에 걸린다), 이름(왼쪽이 파임, 굵은 테), 맺는 말(왼쪽이 파임, 오른쪽이 둥글다) -->
  <path id="tMod" d="M8,0 H104 L126,42 L104,84 H8 A8,8 0 0 1 0,76 V8 A8,8 0 0 1 8,0Z"/>
  <path id="tNoun" d="M0,0 H112 A8,8 0 0 1 120,8 V76 A8,8 0 0 1 112,84 H0 L22,42Z"/>
  <path id="tEnd" d="M0,0 H88 A42,42 0 0 1 88,84 H0 L22,42Z"/>
  <g id="bolt"><circle r="26" fill="url(#fireglow)"/><path d="M0,-16 C9,-6 13,2 9,10 C6,16 3,17 0,17 C-4,17 -9,13 -9,8 C-10,0 -4,-6 0,-16Z" fill="#ff8a2a"/><path d="M0,-4 C4,1 5,6 3,10 C2,12 1,13 0,13 C-2,13 -4,11 -4,8 C-4,4 -2,1 0,-4Z" fill="#ffe08a"/></g>
  <g id="grunt"><ellipse cy="26" rx="26" ry="7" fill="#000" opacity="0.3"/><path d="M-26,24 C-30,-10 -14,-30 0,-30 C14,-30 30,-10 26,24Z" fill="#7bd0a0"/><circle cx="-9" cy="-6" r="6" fill="#fff"/><circle cx="9" cy="-6" r="6" fill="#fff"/><circle cx="-8" cy="-4" r="2.6" fill="#1b2a22"/><circle cx="10" cy="-4" r="2.6" fill="#1b2a22"/><path d="M-10,10 q10,7 20,0" stroke="#1b2a22" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g id="shield"><use href="#grunt"/><path d="M-22,2 h44 v16 q-22,22 -44,0z" fill="#c9d2e6" stroke="#6b7a99" stroke-width="3"/></g>
</defs>

<rect width="540" height="960" fill="url(#dusk)"/>
<!-- 먼 성벽과 달 -->
<circle cx="440" cy="56" r="22" fill="#f6e7c1" opacity="0.9"/>
<path d="M0,96 L60,74 L120,92 L190,66 L270,88 L350,62 L430,90 L500,70 L540,84 V110 H0Z" fill="#1c1430"/>

<!-- 싸움터: 멀수록 좁다. 세 줄 -->
<path d="M168,100 H372 L528,540 H12Z" fill="url(#field)"/>
<g stroke="#2c2040" stroke-width="3" opacity="0.8"><path d="M236,100 L184,540"/><path d="M304,100 L356,540"/></g>
<!-- 가장 가까이 온 줄의 바닥이 달아오른다 -->
<path d="M356,540 L528,540 L463,356 L334,356Z" fill="#ff4d4d" opacity="0.2"/>

<!-- 적: 멀면 작고 가까우면 크다 -->
<use href="#grunt" transform="translate(206,140) scale(0.5)"/><use href="#grunt" transform="translate(262,150) scale(0.52)"/>
<use href="#grunt" transform="translate(330,170) scale(0.6)"/>
<use href="#shield" transform="translate(150,330) scale(1.0)"/>
<use href="#grunt" transform="translate(270,262) scale(0.82)"/>
<use href="#grunt" transform="translate(412,404) scale(1.25)"/>
<!-- 위험: 곧 닿는다 -->
<g transform="translate(470,330)"><path d="M0,-20 L18,12 H-18Z" fill="#ff4d4d"/><rect x="-2.5" y="-9" width="5" height="12" fill="#fff"/><circle cy="8" r="2.6" fill="#fff"/></g>

<!-- 지금 날아간 주문: 가운데 줄의 적에게 맞고 "갈라지는"이 발동 — 셋으로 -->
<circle cx="270" cy="262" r="46" fill="none" stroke="#ffe08a" stroke-width="4" opacity="0.9"/>
<circle cx="270" cy="262" r="62" fill="none" stroke="#ffe08a" stroke-width="2" opacity="0.45"/>
<g stroke="#ffb347" stroke-width="6" stroke-linecap="round" opacity="0.55"><path d="M270,262 L196,300"/><path d="M270,262 L270,208"/><path d="M270,262 L352,318"/></g>
<use href="#bolt" transform="translate(186,306)"/><use href="#bolt" transform="translate(270,196)"/><use href="#bolt" transform="translate(364,326)"/>
<!-- 주문이 날아온 자취 -->
<path d="M270,470 L270,300" stroke="#ffb347" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.6"/>
<!-- 둘째 문장의 주문(얼음)이 지팡이 끝에서 맺히는 중 -->
<circle cx="300" cy="446" r="13" fill="#bfe9ff"/><circle cx="300" cy="446" r="22" fill="none" stroke="#bfe9ff" stroke-width="3" opacity="0.6"/>

<!-- 결계: 룬 다섯 개 중 넷이 남았다 -->
<path d="M12,540 Q270,500 528,540" stroke="#9ad7ff" stroke-width="6" fill="none"/>
<g fill="#9ad7ff"><circle cx="70" cy="528" r="8"/><circle cx="170" cy="514" r="8"/><circle cx="270" cy="509" r="8"/><circle cx="370" cy="514" r="8"/></g>
<circle cx="470" cy="528" r="8" fill="none" stroke="#9ad7ff" stroke-width="3" opacity="0.5"/>

<!-- 마법사: 뒷모습, 화면의 손 -->
<g transform="translate(270,500)">
  <ellipse cy="46" rx="34" ry="8" fill="#000" opacity="0.35"/>
  <path d="M-30,46 C-30,6 -16,-10 0,-10 C16,-10 30,6 30,46Z" fill="#4b3a8c"/>
  <path d="M-26,-12 L0,-70 L26,-12Z" fill="#6a55c2"/><ellipse cy="-12" rx="34" ry="9" fill="#5a47ab"/>
  <path d="M30,30 L30,-56" stroke="#c9a36a" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- 파 진행: 다섯 중 둘째 -->
<g transform="translate(222,36)"><circle r="7" fill="#f6e7c1"/><circle cx="24" r="9" fill="#ffb347"/><circle cx="48" r="7" fill="none" stroke="#f6e7c1" stroke-width="2"/><circle cx="72" r="7" fill="none" stroke="#f6e7c1" stroke-width="2"/><circle cx="96" r="7" fill="none" stroke="#f6e7c1" stroke-width="2"/></g>

<!-- 아래: 펼친 주문서 -->
<rect y="560" width="540" height="400" fill="url(#desk)"/>
<path d="M0,560 H540" stroke="#bfa66c" stroke-width="6"/>

<!-- 첫째 문장: 갈라지는 · 튕기는 · 불꽃 -->
<g transform="translate(16,584)">
  <circle cx="14" cy="42" r="12" fill="#ff8a2a"/>
  <g transform="translate(36,0)">
    <use href="#tMod" fill="#ffd37a" stroke="#ff8a2a" stroke-width="5"/>
    <g stroke="#ff8a2a" stroke-width="4" stroke-linecap="round"><path d="M10,-10 l-8,-10 M60,-12 v-13 M112,-10 l8,-10"/></g>
    <g stroke="#7a4a12" stroke-width="4" fill="none" stroke-linecap="round"><path d="M56,14 v10 M56,24 l-14,10 M56,24 l14,10 M56,24 v12"/></g>
    <text x="58" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#5a3408">갈라지는</text>
  </g>
  <g transform="translate(150,0)">
    <use href="#tMod" fill="#fbf3dc" stroke="#7a6a48" stroke-width="3"/>
    <use href="#tMod" fill="none" stroke="#ff8a2a" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M36,16 l14,16 l12,-14 l12,12" stroke="#5a4a2c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#3c3222">튕기는</text>
  </g>
  <g transform="translate(264,0)">
    <use href="#tNoun" transform="translate(0,0)" fill="#fbf3dc" stroke="#3c3222" stroke-width="6"/>
    <use href="#bolt" transform="translate(70,26) scale(0.8)"/>
    <text x="70" y="70" text-anchor="middle" font-size="23" font-weight="800" fill="#3c3222">불꽃</text>
  </g>
</g>

<!-- 둘째 문장: 커다란 · 얼음 · 얼린다. 지금 읽히는 중(읽기 빛이 둘째 낱말까지 왔다) -->
<g transform="translate(16,690)">
  <circle cx="14" cy="42" r="12" fill="#7cc9ff"/>
  <rect x="34" y="-6" width="250" height="96" rx="14" fill="#7cc9ff" opacity="0.28"/>
  <g transform="translate(36,0)">
    <use href="#tMod" fill="#fbf3dc" stroke="#7a6a48" stroke-width="3"/>
    <circle cx="56" cy="26" r="13" fill="none" stroke="#5a4a2c" stroke-width="4"/><circle cx="56" cy="26" r="5" fill="#5a4a2c"/>
    <text x="58" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#3c3222">커다란</text>
  </g>
  <g transform="translate(150,0)">
    <use href="#tNoun" fill="#fbf3dc" stroke="#3c3222" stroke-width="6"/>
    <path d="M70,10 v32 M56,18 l28,16 M84,18 l-28,16" stroke="#3b9be0" stroke-width="5" stroke-linecap="round"/>
    <text x="70" y="70" text-anchor="middle" font-size="23" font-weight="800" fill="#3c3222">얼음</text>
  </g>
  <g transform="translate(258,0)">
    <use href="#tEnd" fill="#fbf3dc" stroke="#7a6a48" stroke-width="3"/>
    <rect x="52" y="12" width="24" height="24" rx="5" fill="none" stroke="#3b9be0" stroke-width="4"/>
    <text x="66" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#3c3222">얼린다</text>
  </g>
  <!-- 빈칸: 여기에 놓을 수 있다 -->
  <rect x="398" y="6" width="104" height="72" rx="10" fill="none" stroke="#bfa66c" stroke-width="3" stroke-dasharray="8 8"/>
</g>

<!-- 낱말 주머니 -->
<path d="M0,800 H540 V960 H0Z" fill="#cdb98a"/>
<path d="M0,800 Q270,784 540,800" stroke="#a68f5a" stroke-width="4" fill="none"/>
<g transform="translate(24,836) scale(0.82)">
  <g><use href="#tNoun" fill="#fbf3dc" stroke="#3c3222" stroke-width="6"/><path d="M48,34 l22,-22 22,22 -8,6 h-28z" fill="#8a8f98"/><text x="70" y="70" text-anchor="middle" font-size="23" font-weight="800" fill="#3c3222">돌</text></g>
  <g transform="translate(150,0)"><use href="#tEnd" fill="#fbf3dc" stroke="#7a6a48" stroke-width="3"/><g stroke="#d9432f" stroke-width="4" stroke-linecap="round"><path d="M66,12 v8 M66,30 v8 M52,25 h8 M72,25 h8 M56,15 l5,5 M76,15 l-5,5"/></g><text x="66" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#3c3222">터진다</text></g>
  <g transform="translate(300,0)"><rect width="126" height="84" rx="10" fill="none" stroke="#a68f5a" stroke-width="3" stroke-dasharray="8 8"/></g>
  <g transform="translate(446,0)"><use href="#tMod" fill="#fbf3dc" stroke="#7a6a48" stroke-width="3"/><path d="M34,26 h30 M46,16 l22,10 -22,10" stroke="#5a4a2c" stroke-width="4" fill="none" stroke-linecap="round"/><text x="58" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#3c3222">빠른</text></g>
</g>

<!-- 손가락으로 들어 올린 낱말: 주머니에서 꺼내 둘째 문장으로 가져가는 중. 들고 있는 동안 세상이 느려진다 -->
<g transform="translate(400,664) rotate(-7)">
  <use href="#tMod" transform="translate(6,10)" fill="#000" opacity="0.25"/>
  <use href="#tMod" fill="#fff8e2" stroke="#3c3222" stroke-width="4"/>
  <path d="M30,26 h52 M70,16 l14,10 -14,10" stroke="#5a4a2c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="58" y="68" text-anchor="middle" font-size="21" font-weight="700" fill="#3c3222">꿰뚫는</text>
</g>
<circle cx="500" cy="752" r="26" fill="#fff" opacity="0.35"/><circle cx="500" cy="752" r="26" fill="none" stroke="#8a7a52" stroke-width="3" opacity="0.8"/>
</svg>
