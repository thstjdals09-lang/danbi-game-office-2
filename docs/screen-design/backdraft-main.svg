<svg viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="wood" width="90" height="30" patternUnits="userSpaceOnUse">
    <rect width="90" height="30" fill="#4a3626"/><rect y="28" width="90" height="2" fill="#35261a"/>
    <rect x="40" y="0" width="2" height="14" fill="#3b2a1d"/><rect x="70" y="14" width="2" height="14" fill="#3b2a1d"/>
  </pattern>
  <pattern id="carpet" width="18" height="18" patternUnits="userSpaceOnUse">
    <rect width="18" height="18" fill="#3a3558"/><circle cx="9" cy="9" r="1.8" fill="#55508a"/>
  </pattern>
  <pattern id="hazard" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="13" height="26" fill="#ff5a3c" opacity="0.5"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff2c4" stop-opacity="0.34"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#070b11" stop-opacity="0"/><stop offset="1" stop-color="#070b11" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="fadeT" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#070b11" stop-opacity="0"/><stop offset="1" stop-color="#070b11" stop-opacity="0.85"/>
  </linearGradient>
  <g id="flame">
    <path d="M0,-46 C16,-26 30,-12 22,12 C18,26 8,32 0,32 C-10,32 -22,24 -24,10 C-28,-10 -10,-22 0,-46Z" fill="#f47b20"/>
    <path d="M0,-18 C10,-6 14,4 10,16 C7,24 3,26 0,26 C-5,26 -11,20 -11,12 C-12,2 -5,-6 0,-18Z" fill="#ffd45e"/>
  </g>
  <g id="heart"><path d="M0,8 C-14,-4 -10,-14 -4,-14 C-1,-14 0,-11 0,-10 C0,-11 1,-14 4,-14 C10,-14 14,-4 0,8Z" fill="#ff5a4d"/></g>
  <g id="drop"><path d="M0,-9 C5,-2 7,2 7,5 A7,7 0 1 1 -7,5 C-7,2 -5,-2 0,-9Z"/></g>
  <clipPath id="screen"><rect width="540" height="960" rx="18"/></clipPath>
</defs>
<g clip-path="url(#screen)">
  <rect width="540" height="960" fill="#0b1118"/>

  <!-- 닫힌 왼쪽 방: 보이지 않는다 -->
  <rect x="-45" y="-45" width="180" height="1050" fill="#080c12"/>
  <g opacity="0.5">
    <circle cx="70" cy="470" r="5" fill="#b3402a"/><circle cx="20" cy="560" r="4" fill="#b3402a"/><circle cx="96" cy="610" r="3" fill="#b3402a"/>
  </g>

  <!-- 복도 -->
  <rect x="225" y="-45" width="90" height="1050" fill="url(#wood)"/>
  <!-- 오른쪽 방 (문이 열려 있어 보인다) -->
  <rect x="405" y="315" width="180" height="360" fill="url(#carpet)"/>
  <rect x="405" y="-45" width="180" height="270" fill="#080c12"/>
  <rect x="405" y="765" width="180" height="240" fill="#080c12"/>

  <!-- 벽 -->
  <g fill="#1f2a37">
    <rect x="135" y="-45" width="90" height="540"/><rect x="135" y="585" width="90" height="420"/>
    <rect x="315" y="-45" width="90" height="540"/><rect x="315" y="585" width="90" height="420"/>
    <rect x="405" y="225" width="180" height="90"/><rect x="405" y="675" width="180" height="90"/>
  </g>
  <g fill="#34455a">
    <rect x="135" y="-45" width="90" height="6"/><rect x="315" y="-45" width="90" height="6"/>
    <rect x="135" y="585" width="90" height="7"/><rect x="315" y="585" width="90" height="7"/>
    <rect x="405" y="225" width="180" height="7"/><rect x="405" y="675" width="180" height="7"/>
  </g>
  <rect x="218" y="-45" width="7" height="540" fill="#111922"/><rect x="315" y="-45" width="7" height="540" fill="#111922"/>

  <!-- 역류가 지나갈 길: 왼쪽 문 → 나 → 열린 문 → 방 한 칸 -->
  <rect x="135" y="495" width="360" height="90" fill="url(#hazard)"/>

  <!-- 복도의 불과 열 -->
  <circle cx="270" cy="170" r="150" fill="url(#glow)"/>
  <use href="#flame" transform="translate(270,90) scale(1.25)"/>
  <use href="#flame" transform="translate(246,196) scale(1.0)"/><use href="#flame" transform="translate(292,186) scale(1.15)"/>
  <!-- 다음 박자에 붙을 칸: 옆 칸의 불이 혀를 내민다 + 바닥이 달아오른다 -->
  <rect x="225" y="225" width="90" height="90" fill="#ff7a1a" opacity="0.28"/>
  <path d="M240,232 q8,22 0,40 M268,228 q10,30 -2,54 M298,232 q8,20 0,36" stroke="#ffd45e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 그 다음 칸: 금이 간다 -->
  <path d="M244,330 l10,22 -8,18 M286,326 l-8,26 10,20" stroke="#ffb347" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 오른쪽 방 안: 불, 사람 -->
  <circle cx="520" cy="360" r="110" fill="url(#glow)"/>
  <use href="#flame" transform="translate(516,372) scale(1.2)"/>
  <path d="M424,338 l10,20 -8,16 M462,330 l-6,22 8,18" stroke="#ffb347" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- 갇힌 사람: 숨이 고리로 줄어든다 -->
  <g transform="translate(450,450)">
    <circle r="38" fill="none" stroke="#2a3340" stroke-width="7"/>
    <path d="M0,-38 A38,38 0 1 1 -32.9,19" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle r="26" fill="#f4f6f8"/><circle cx="-8" cy="-4" r="3.5" fill="#2a3340"/><circle cx="8" cy="-4" r="3.5" fill="#2a3340"/>
    <path d="M-8,10 q8,-6 16,0" stroke="#2a3340" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="#c9d2dc" opacity="0.8"><circle cx="34" cy="-30" r="5"/><circle cx="44" cy="-40" r="7"/></g>
  </g>

  <!-- 열린 오른쪽 문: 문짝이 벽에 붙어 있고, 닫기 손잡이가 뜬다 -->
  <rect x="315" y="495" width="90" height="90" fill="#2a3340"/>
  <rect x="315" y="495" width="90" height="90" fill="url(#hazard)"/>
  <rect x="322" y="497" width="76" height="12" rx="4" fill="#c9a36a"/><circle cx="328" cy="503" r="6" fill="#7a6038"/>
  <g transform="translate(360,548)">
    <circle r="27" fill="#0b1118" opacity="0.85"/><circle r="27" fill="none" stroke="#dfe7f1" stroke-width="3"/>
    <rect x="-10" y="-13" width="14" height="26" rx="2" fill="#c9a36a"/><path d="M8,0 h12 m-6,-6 l6,6 -6,6" stroke="#dfe7f1" stroke-width="3" fill="none" stroke-linecap="round" transform="rotate(180 14 0)"/>
  </g>

  <!-- 닫힌 왼쪽 문: 역류 징후 — 문틈이 달아오르고, 연기가 안으로 빨려 들고, 문이 떤다 -->
  <rect x="135" y="495" width="90" height="90" fill="#2a3340"/>
  <rect x="135" y="495" width="90" height="90" fill="url(#hazard)"/>
  <rect x="171" y="499" width="18" height="82" rx="5" fill="#c9a36a"/>
  <rect x="166" y="499" width="5" height="82" fill="#ff7a1a"/><rect x="189" y="499" width="5" height="82" fill="#ff7a1a" opacity="0.5"/>
  <path d="M162,507 l-7,-3 M162,573 l-7,3 M198,507 l7,-3 M198,573 l7,3" stroke="#ffb347" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#c9d2dc" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M222,516 q-16,-2 -26,8"/><path d="M224,540 q-14,0 -28,0"/><path d="M222,564 q-16,2 -26,-8"/>
    <path d="M204,522 l-8,2 4,-8 M202,540 l-7,0 M204,558 l-8,-2 4,8"/>
  </g>

  <!-- 소방관: 화면의 주인공. 손전등 빛 -->
  <circle cx="270" cy="500" r="190" fill="url(#lamp)"/>
  <g transform="translate(270,540)">
    <ellipse cx="0" cy="30" rx="30" ry="9" fill="#000" opacity="0.4"/>
    <circle r="35" fill="#101820"/><circle r="32" fill="#ffd23c"/>
    <rect x="-31" y="-10" width="62" height="12" fill="#b8322a"/>
    <path d="M-14,-32 a14,14 0 0 1 28,0" fill="#e9bd2a"/>
    <!-- 박자: 발밑의 두 점. 하나가 찼다 = 다음 행동에 불이 움직인다 -->
    <circle cx="-9" cy="48" r="6" fill="#ff7a1a"/><circle cx="9" cy="48" r="6" fill="none" stroke="#ff7a1a" stroke-width="3"/>
  </g>

  <!-- 화면 밖의 사람: 가장자리 화살표 + 숨 고리 -->
  <g transform="translate(34,360)">
    <path d="M-22,0 l16,-14 v28z" fill="#f4f6f8"/>
    <circle cx="14" r="17" fill="#0b1118" opacity="0.8"/><circle cx="14" r="17" fill="none" stroke="#2a3340" stroke-width="5"/>
    <path d="M14,-17 A17,17 0 0 1 31,0" fill="none" stroke="#ff5a4d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="14" r="9" fill="#f4f6f8"/>
  </g>

  <!-- 위: 체력, 구한 사람, 작은 설계도 -->
  <rect width="540" height="150" fill="url(#fadeT)"/>
  <g transform="translate(34,44)"><use href="#heart" transform="scale(1.5)"/><use href="#heart" transform="translate(34,0) scale(1.5)"/>
    <use href="#heart" transform="translate(68,0) scale(1.5)"/><use href="#heart" transform="translate(102,0) scale(1.5)" opacity="0.25"/></g>
  <g transform="translate(34,92)" fill="none" stroke="#dfe7f1" stroke-width="3">
    <circle r="11"/><circle cx="30" r="11"/><circle cx="60" r="11"/>
  </g>
  <g transform="translate(396,20)">
    <rect width="128" height="150" rx="10" fill="#0e1a2b" stroke="#3d5a80" stroke-width="2"/>
    <g fill="none" stroke="#6f8fb5" stroke-width="2"><rect x="12" y="14" width="36" height="52"/><rect x="80" y="14" width="36" height="52"/>
      <rect x="12" y="78" width="36" height="52"/><rect x="80" y="78" width="36" height="52"/><path d="M56,8 v134 M72,8 v134"/></g>
    <rect x="57" y="20" width="14" height="30" fill="#f47b20"/><rect x="92" y="84" width="16" height="16" fill="#f47b20"/>
    <rect x="14" y="80" width="32" height="48" fill="#5a2a22" opacity="0.8"/>
    <circle cx="64" cy="104" r="5" fill="#ffd23c"/><circle cx="92" cy="110" r="4" fill="#fff"/><circle cx="26" cy="54" r="4" fill="#fff"/><circle cx="100" cy="30" r="4" fill="#fff"/>
    <rect x="34" y="72" width="62" height="62" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="58" y="134" width="12" height="8" fill="#3fa46a"/>
  </g>

  <!-- 아래: 공기통(가장 큰 계기), 기다리기, 호스 -->
  <rect y="760" width="540" height="200" fill="url(#fadeB)"/>
  <g transform="translate(84,872)">
    <circle r="58" fill="#0e1620" stroke="#34455a" stroke-width="3"/>
    <path d="M-41,29 A50,50 0 1 1 41,29" fill="none" stroke="#243140" stroke-width="12" stroke-linecap="round"/>
    <path d="M-41,29 A50,50 0 1 1 32.1,-38.3" fill="none" stroke="#7fd3ff" stroke-width="12" stroke-linecap="round"/>
    <text y="12" text-anchor="middle" font-size="34" font-weight="700" fill="#eaf4ff" font-family="Malgun Gothic">134</text>
    <path d="M-10,34 h20 M-6,42 h12" stroke="#7fd3ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(270,890)">
    <circle r="38" fill="#141d28" stroke="#4a5d74" stroke-width="3"/>
    <path d="M-12,-16 h24 l-10,16 10,16 h-24 l10,-16z" fill="none" stroke="#dfe7f1" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(452,868)">
    <circle r="64" fill="#13324d" stroke="#5ab0ff" stroke-width="4"/>
    <path d="M-30,16 l34,-34 14,14 -34,34z" fill="#dfe7f1"/><path d="M8,-22 l14,-14 16,16 -14,14z" fill="#b8322a"/>
    <g fill="#5ab0ff"><use href="#drop" transform="translate(-46,-66)"/><use href="#drop" transform="translate(-24,-78)"/><use href="#drop" transform="translate(0,-82)"/>
      <use href="#drop" transform="translate(24,-78)"/><use href="#drop" transform="translate(46,-66)"/></g>
    <g fill="#243140"><use href="#drop" transform="translate(-64,-46)"/><use href="#drop" transform="translate(64,-46)"/><use href="#drop" transform="translate(76,-22)"/></g>
  </g>
</g>
</svg>
