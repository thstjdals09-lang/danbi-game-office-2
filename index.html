<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단비의 게임회사2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23f3c86a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #07111e; --panel: #0d1a2c; --panel-2: #0a1626; --line: #233853; --line-soft: rgba(255,255,255,.07);
    --text: #edf4ff; --muted: #8fa3bf; --dim: #5f7694;
    --accent: #74a7ff; --green: #55d6a8; --amber: #f3c86a; --red: #ff7d8e; --purple: #bc9cff; --cyan: #67d9eb;
    --radius: 14px; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); font: 14px/1.55 "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; padding-bottom: 64px; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }

  /* 상단: 제목 + 탭 (고정) */
  .top { position: sticky; top: 0; z-index: 5; background: rgba(7,17,30,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-soft); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
  .brand { font-size: 17px; font-weight: 800; white-space: nowrap; }
  .top-actions { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .updated { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
  @media (max-width: 520px) { .updated { display: none; } }
  .demo-tag { font-size: 11px; color: var(--amber); border: 1px dashed rgba(243,200,106,.5); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { background: none; border: 0; border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .nav button:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .nav button[aria-current="page"] { color: var(--text); background: #16294a; font-weight: 700; }
  .badge { font-size: 11px; font-weight: 700; min-width: 18px; padding: 1px 6px; border-radius: 999px; background: rgba(255,255,255,.09); color: var(--muted); text-align: center; }
  .badge.attn { background: var(--amber); color: #2a1c00; }

  .btn { font-size: 13px; background: #16294a; border: 1px solid #2b4a78; border-radius: 9px; padding: 7px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; color: var(--text); }
  .btn:hover { background: #1c3460; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
  .btn.go { background: var(--green); border-color: var(--green); color: #06221a; font-weight: 700; }
  .btn.warn { background: transparent; border-color: rgba(243,200,106,.5); color: var(--amber); }
  .btn.bad { background: transparent; border-color: rgba(255,125,142,.45); color: var(--red); }
  .btn.small { font-size: 12px; padding: 5px 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  main { display: grid; gap: 22px; padding-top: 20px; }
  .view { display: grid; gap: 22px; }
  .sec { display: grid; gap: 10px; min-width: 0; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sec-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .sec-head span { font-size: 12px; color: var(--dim); }
  .empty { font-size: 13px; color: var(--dim); padding: 18px 14px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }

  /* 결재함: 요약 타일 */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { text-align: left; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: grid; gap: 2px; }
  .tile:hover { border-color: var(--line); }
  .tile .n { font-size: 28px; font-weight: 800; line-height: 1.1; }
  .tile .l { font-size: 13px; font-weight: 500; }
  .tile .h { font-size: 11px; color: var(--dim); }
  .tile.attn { border-color: rgba(243,200,106,.45); }
  .tile.attn .n { color: var(--amber); }
  .tile.zero .n { color: var(--dim); }
  @media (max-width: 520px) { .tile { padding: 12px; } .tile .n { font-size: 24px; } .tile .h { display: none; } }

  /* 카드(결재 항목) */
  .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
  .card.attn { border-color: rgba(243,200,106,.4); }
  .card.bad { border-color: rgba(255,125,142,.4); }
  .card-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 16px; font-weight: 700; }
  .p { font-size: 13px; color: var(--muted); }
  .summary { font-size: 13px; color: var(--text); white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 10px; }
  .note { font-size: 13px; color: var(--amber); white-space: pre-wrap; background: rgba(243,200,106,.07); border-radius: 8px; padding: 8px 10px; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); white-space: nowrap; }
  .chip.verb { color: var(--cyan); background: rgba(103,217,235,.1); }
  .chip.next { color: var(--purple); background: rgba(188,156,255,.12); }
  .chip.ms { color: var(--amber); background: rgba(243,200,106,.12); font-weight: 700; }
  .chip.ok { color: var(--green); background: rgba(85,214,168,.13); }
  .fold.ask > summary { grid-template-columns: auto minmax(0, 1fr) auto; padding: 9px 14px; }
  .fold.ask:not([open]) .fold-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fold.ask .fold-main { gap: 1px; }
  .fold.ask.attn { border-color: rgba(243,200,106,.4); }
  .fold.ask .fold-title { font-weight: 500; }
  .fold.ask[open] .fold-sub { display: block; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
  .opt { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
  .opt.chosen { border-color: var(--green); }
  .opt .nm { font-size: 14px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .opt .ds { font-size: 12px; color: var(--text); }
  .opt .pc { font-size: 12px; color: var(--muted); }
  .opt .pro { color: var(--green); } .opt .con { color: var(--red); }
  .opt .acts { margin-top: auto; }
  .stage { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: var(--accent); background: rgba(116,167,255,.14); white-space: nowrap; }
  .stage.wait { color: var(--muted); background: rgba(255,255,255,.07); }
  .stage.done { color: var(--green); background: rgba(85,214,168,.13); }
  .stage.warn { color: var(--amber); background: rgba(243,200,106,.13); }
  .stage.off { color: var(--dim); background: rgba(255,255,255,.04); }

  /* 접히는 줄 */
  .fold { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; }
  .fold > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary:hover { background: rgba(255,255,255,.025); }
  .fold[open] > summary { border-bottom: 1px solid var(--line-soft); }
  .chev { width: 18px; text-align: center; color: var(--dim); transition: transform .15s; }
  .fold[open] .chev { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  .fold-main { min-width: 0; display: grid; gap: 4px; }
  .fold-title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; }
  .fold-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fold[open] .fold-sub { display: none; }
  .fold-body { padding: 14px; display: grid; gap: 10px; }
  .fold-side { display: flex; gap: 8px; align-items: center; }
  .list { display: grid; gap: 8px; }

  /* 진행 점 */
  .steps { display: flex; gap: 3px; align-items: center; }
  .steps i { width: 14px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
  .steps i.done { background: var(--green); }
  .steps i.now { background: var(--accent); }
  .steps i.stop { background: var(--amber); }
  @media (max-width: 520px) { .steps { display: none; } }

  .star { background: none; border: 0; cursor: pointer; font-size: 20px; line-height: 1; color: var(--dim); padding: 2px 4px; }
  .star[aria-pressed="true"] { color: var(--amber); }
  .star:disabled { cursor: not-allowed; opacity: .6; }
  /* 아이디어 대기: 2열 카드(제목 · 별 · 두 줄 설명 · 조작). 카드를 누르면 상세 창이 뜬다 */
  .ideas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 640px) { .ideas { grid-template-columns: minmax(0, 1fr); } }
  .ideas > .empty { grid-column: 1 / -1; }
  .icard { position: relative; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); }
  .icard:hover { border-color: var(--line); }
  .icard.on { border-color: rgba(243,200,106,.35); }
  .ic-main { width: 100%; height: 100%; text-align: left; background: none; border: 0; border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: grid; gap: 8px; align-content: start; }
  .ic-main .t { font-size: 15px; font-weight: 700; padding-right: 36px; }
  .ic-main .d { font-size: 13px; line-height: 1.6; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ic-main .tags { display: flex; gap: 6px; min-width: 0; }
  .ic-main .chip { overflow: hidden; text-overflow: ellipsis; }
  .ic-main .chip.next { flex: none; }
  .icard .star { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; padding: 0; font-size: 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); color: var(--muted); }
  .icard .star[aria-pressed="true"] { color: var(--amber); border-color: rgba(243,200,106,.5); background: rgba(243,200,106,.1); }
  .filters b { font-weight: 700; margin-left: 2px; }
  .iview { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; padding: 16px 22px 20px; display: grid; gap: 14px; align-content: start; }
  .iview h3 { margin: 0; font-size: 20px; line-height: 1.3; }
  .iv-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .iv-turn { font-size: 12px; color: var(--dim); }
  .iv-nav { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .istar { background: transparent; border-color: rgba(243,200,106,.5); color: var(--amber); }
  .istar:hover { background: rgba(243,200,106,.1); }
  .istar[aria-pressed="true"], .istar[aria-pressed="true"]:hover { background: var(--amber); border-color: var(--amber); color: #2a1c00; font-weight: 700; }
  .iv-pitch { margin: 0; font-size: 15px; line-height: 1.7; }
  .iv-facts { margin: 0; display: grid; gap: 12px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
  .iv-facts > div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; }
  .iv-facts dt { font-size: 12px; color: var(--dim); font-weight: 700; padding-top: 1px; }
  .iv-facts dd { margin: 0; font-size: 13px; }
  .iv-facts ul, .iv-facts ol { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
  @media (max-width: 520px) { .iv-facts > div { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
  .bars { display: grid; gap: 4px; max-width: 360px; }
  .bars > div { display: grid; grid-template-columns: 44px minmax(0, 1fr) 24px; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .bars i { display: block; height: 6px; border-radius: 3px; background: var(--line); }
  .bars i b { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .bars .low i b { background: var(--amber); }
  .bars .n { text-align: right; color: var(--text); }
  .why { margin: 0; padding-left: 18px; font-size: 13px; }
  .next-test { font-size: 13px; color: var(--cyan); }
  .label { font-size: 11px; color: var(--dim); font-weight: 700; letter-spacing: .04em; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .filters button[aria-pressed="true"] { background: #1a3050; color: var(--text); border-color: #2b4a78; }
  .tools { display: flex; gap: 8px; }
  .search { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; color: var(--text); font: inherit; font-size: 13px; }

  /* 게임 라이브러리 */
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .gcard { text-align: left; padding: 0; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: grid; grid-template-rows: auto 1fr; }
  .gcard:hover { border-color: var(--line); }
  .gcard .thumb { aspect-ratio: 4 / 3; background: radial-gradient(circle at 50% 40%, rgba(116,167,255,.22), transparent 60%), #0b1627; display: grid; place-items: center; overflow: hidden; }
  .gcard .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; display: block; }
  .gcard .thumb .ph { font-size: 13px; color: var(--dim); padding: 12px; text-align: center; }
  .gcard .body { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
  .gcard .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .gcard .chips { flex-wrap: nowrap; min-width: 0; }
  .gcard .playable { font-size: 11px; color: var(--green); white-space: nowrap; }
  .gcard .t { font-size: 15px; font-weight: 700; }
  .gcard .d { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gcard .open { font-size: 12px; color: var(--accent); }

  /* 게임 상세 */
  .back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 0; font-size: 13px; justify-self: start; }
  .back:hover { color: var(--text); }
  .ghead { display: grid; gap: 8px; }
  .ghead h2 { margin: 0; font-size: 22px; font-weight: 800; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .playbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; }
  .playbar .btn.go { font-size: 15px; padding: 10px 18px; }
  .arts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .arts { grid-template-columns: repeat(3, minmax(200px, 1fr)); overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; } .art { scroll-snap-align: start; } }
  .art { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
  .art.picked { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
  .art button.pic { padding: 0; border: 0; background: #06101c; cursor: zoom-in; display: block; }
  .art img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; }
  .art .cap { padding: 10px 12px 12px; display: grid; gap: 6px; align-content: start; }
  .art .nm { font-size: 14px; font-weight: 700; }
  .art .nm b { color: var(--accent); margin-right: 6px; }
  .art .ds { font-size: 12px; color: var(--muted); }
  .keyshot { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 12px; }
  .keyshot img { width: 96px; border-radius: 8px; border: 1px solid var(--line); display: block; cursor: zoom-in; }

  /* 공장 */
  .depts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .dept { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 3px; min-width: 0; align-content: start; }
  .dept .name { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
  .dept .when { font-size: 12px; color: var(--muted); }
  .dept .sum { font-size: 11px; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
  .dot.success { background: var(--green); } .dot.noop { background: var(--cyan); } .dot.running { background: var(--accent); }
  .dot.blocked { background: var(--amber); } .dot.failed { background: var(--red); }
  .dots { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; cursor: pointer; width: 100%; text-align: left; }
  .dots span { display: inline-flex; gap: 6px; align-items: center; }

  .line { display: grid; gap: 4px; }
  .lrow { display: grid; grid-template-columns: 64px minmax(0, 96px) 30px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; font-size: 13px; }
  .lrow .who { font-size: 11px; color: var(--dim); font-weight: 700; }
  .lrow .ct { font-size: 17px; font-weight: 800; text-align: right; }
  .lrow.zero .ct { color: var(--dim); }
  .lrow .names { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow.goal .ct { color: var(--green); }
  .lrow.full { border-color: rgba(243,200,106,.45); }

  .events { display: grid; }
  .ev { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .ev:last-child { border-bottom: 0; }
  .ev .tm { font-size: 11px; color: var(--dim); }

  /* 대화상자 */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 0; max-width: calc(100vw - 24px); }
  dialog::backdrop { background: rgba(3,8,15,.78); }
  .dlg { padding: 18px 20px; display: grid; gap: 12px; width: min(420px, calc(100vw - 32px)); }
  .dlg h3 { margin: 0; font-size: 15px; }
  .dlg textarea, .dlg input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; color: var(--text); font: inherit; }
  .dlg textarea { min-height: 110px; resize: vertical; }
  .dlg .acts { justify-content: flex-end; }
  .dlg .hint { font-size: 12px; color: var(--muted); }
  .player { padding: 12px; display: grid; gap: 10px; }
  .player-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .player iframe { border: 0; border-radius: 12px; background: #000; display: block; width: min(405px, calc(100vw - 56px)); aspect-ratio: 9 / 16; max-height: calc(100vh - 140px); }
  .player iframe.landscape { width: min(720px, calc(100vw - 56px)); aspect-ratio: 16 / 9; }
  .player .noplay { width: min(405px, calc(100vw - 56px)); padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }

  #docDlg { width: min(900px, calc(100vw - 24px)); }
  .doc { display: grid; grid-template-rows: auto auto minmax(0, 1fr); max-height: calc(100vh - 48px); }
  .doc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px 8px; }
  .doc-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 14px 10px; border-bottom: 1px solid var(--line-soft); scrollbar-width: none; }
  .doc-tabs::-webkit-scrollbar { display: none; }
  .doc-tabs button { background: none; border: 0; border-radius: 9px; padding: 6px 12px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .doc-tabs button[aria-selected="true"] { background: #16294a; color: var(--text); font-weight: 700; }
  .doc-body { overflow: auto; padding: 6px 22px 28px; font-size: 14px; line-height: 1.7; }
  .doc-body h1 { font-size: 20px; margin: 18px 0 8px; }
  .doc-body h2 { font-size: 16px; margin: 26px 0 8px; padding-top: 14px; border-top: 1px solid var(--line-soft); color: var(--accent); }
  .doc-body h3 { font-size: 14px; margin: 18px 0 6px; }
  .doc-body ul, .doc-body ol { padding-left: 22px; }
  .doc-body blockquote { margin: 10px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .doc-body code { font-family: var(--mono); font-size: 12px; background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 5px; }
  .doc-body pre { background: #06101c; border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px; overflow: auto; }
  .doc-body pre code { background: none; padding: 0; }
  .doc-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
  .doc-body th, .doc-body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .doc-body th { background: rgba(255,255,255,.05); }
  .doc-body a { color: var(--accent); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; padding-top: 14px; }
  .shots figure { margin: 0; display: grid; gap: 6px; }
  .shots img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .shots figcaption { font-size: 11px; color: var(--muted); text-align: center; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1a3050; border: 1px solid #2b4a78; padding: 10px 16px; border-radius: 10px; font-size: 13px; max-width: calc(100vw - 32px); z-index: 10; }
  .toast.err { background: #3a1621; border-color: rgba(255,125,142,.5); }
  .foot { font-size: 11px; color: var(--dim); padding-top: 6px; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">단비의 게임회사2</div>
      <div class="top-actions">
        <span class="demo-tag" id="demoTag" hidden>예시 데이터</span>
        <span class="updated" id="updated"></span>
        <button class="btn ghost small" id="refresh" type="button">새로고침</button>
        <button class="btn small" id="login" type="button">대표 로그인</button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="화면 이동"></nav>
  </div>
</header>

<div class="wrap">
<main>
  <!-- 결재함: 대표가 할 일만 -->
  <section class="view" id="view-home">
    <div class="tiles" id="tiles"></div>
    <div class="sec">
      <div class="sec-head"><h2>플레이테스트</h2><span>게임을 눌러 플레이하고 판정해 주세요</span></div>
      <div class="lib" id="playtest"></div>
    </div>
    <div class="sec" id="askSec" hidden>
      <div class="sec-head"><h2>결정 요청</h2><span id="askSide"></span></div>
      <div class="list" id="asks"></div>
    </div>
    <div class="sec" id="heldSec">
      <div class="sec-head"><h2>판단 필요</h2><span>부서가 스스로 풀지 못한 건</span></div>
      <div class="list" id="held"></div>
    </div>
    <div class="sec">
      <div class="sec-head"><h2>공장 상태</h2><span>눌러서 자세히</span></div>
      <button class="dots" id="homeDots" type="button" data-go="factory"></button>
    </div>
  </section>

  <!-- 게임: 라이브러리(카드) → 게임 상세 -->
  <section class="view" id="view-games" hidden>
    <div id="gameLib" class="sec">
      <div class="sec-head"><h2>게임 라이브러리</h2><span>게임을 눌러 플레이하고, 아트 방향을 살펴보세요</span></div>
      <div class="filters" id="gameFilters"></div>
      <div class="lib" id="games"></div>
    </div>
    <div id="gameDetail" class="view" hidden></div>
  </section>

  <!-- 아이디어 -->
  <section class="view" id="view-ideas" hidden>
    <div class="sec">
      <div class="sec-head"><h2>아이디어 대기</h2><span id="ideaCount"></span></div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="검색 (제목, 설명, 조작, 장르)">
      </div>
      <div class="filters">
        <button id="ideaAll" type="button" aria-pressed="true">전체</button>
        <button id="ideaStar" type="button" aria-pressed="false">★ 우선</button>
      </div>
      <div class="ideas" id="ideas"></div>
      <button class="btn ghost" id="more" type="button" hidden>더 보기</button>
    </div>
  </section>

  <!-- 공장: 부서와 라인 -->
  <section class="view" id="view-factory" hidden>
    <div class="sec">
      <div class="sec-head"><h2>부서 출근부</h2><span>가장 최근 실행</span></div>
      <div class="depts" id="depts"></div>
    </div>
    <div class="sec">
      <div class="sec-head"><h2>생산 라인</h2><span id="lineSide"></span></div>
      <div class="line" id="line"></div>
    </div>
    <details class="fold" data-fold="events">
      <summary><span class="chev">›</span><span class="fold-main"><span class="fold-title">사건 기록</span></span><span class="fold-side"><span class="badge" id="evCount">0</span></span></summary>
      <div class="fold-body"><div class="events" id="events"></div></div>
    </details>
    <div class="foot">운영 규칙: <a id="docLink" href="#" target="_blank" rel="noopener">docs/OPERATING_MODEL.md</a> · 부서 프롬프트: <a id="promptLink" href="#" target="_blank" rel="noopener">prompts/</a></div>
  </section>
</main>
</div>

<dialog id="noteDlg">
  <form class="dlg" method="dialog">
    <h3 id="noteTitle"></h3>
    <div class="hint" id="noteHint"></div>
    <textarea id="noteText"></textarea>
    <div class="acts">
      <button class="btn ghost" type="button" data-close>취소</button>
      <button class="btn go" value="ok" type="submit">보내기</button>
    </div>
  </form>
</dialog>

<dialog id="loginDlg">
  <form class="dlg" method="dialog">
    <h3>대표 로그인</h3>
    <div class="hint">등록된 대표 메일로 로그인 링크를 보냅니다. 메일의 링크를 누르면 이 화면으로 돌아옵니다.</div>
    <input id="loginEmail" type="email" placeholder="메일 주소" autocomplete="email">
    <div class="acts">
      <button class="btn ghost" type="button" data-close>취소</button>
      <button class="btn go" value="ok" type="submit">링크 보내기</button>
    </div>
  </form>
</dialog>

<dialog id="docDlg">
  <div class="doc">
    <div class="doc-head">
      <strong id="docTitle"></strong>
      <div style="display:flex;gap:8px">
        <a class="btn ghost small" id="docGithub" target="_blank" rel="noopener" href="#">GitHub</a>
        <form method="dialog"><button class="btn ghost small" type="submit">닫기</button></form>
      </div>
    </div>
    <div class="doc-tabs" id="docTabs"></div>
    <div class="doc-body" id="docBody"></div>
  </div>
</dialog>

<dialog id="ideaDlg"><div class="iview" id="ideaBody"></div></dialog>

<dialog id="imgDlg">
  <div class="player">
    <div class="player-head">
      <strong id="imgTitle"></strong>
      <form method="dialog"><button class="btn ghost small" type="submit">닫기</button></form>
    </div>
    <img id="imgBig" alt="" style="display:block;max-width:min(560px, calc(100vw - 56px));max-height:calc(100vh - 130px);border-radius:12px">
  </div>
</dialog>

<dialog id="playDlg">
  <div class="player">
    <div class="player-head">
      <strong id="playTitle"></strong>
      <form method="dialog"><button class="btn ghost small" type="submit">닫기</button></form>
    </div>
    <div id="playBody"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
